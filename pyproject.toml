[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recovery"
version = "0.1.0"
description = "Track 03 — AI Revenue Recovery: incremental money recovered from failed recurring payments against a holdout control arm."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "razorpay>=1.4",
    "numpy>=2.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["recovery*"]

[tool.pytest.ini_options]
markers = [
    "live: hits the Razorpay test-mode API. Skipped automatically without credentials, so `pytest` stays green for a reviewer who has no keys.",
]
